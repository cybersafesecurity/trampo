name: Deploy Trampo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build live Supabase app for Pages
        run: npm run build:pages:live
        env:
          # Browser-safe public values only (the publishable key is protected by RLS).
          VITE_TRAMPO_BACKEND: supabase
          VITE_SUPABASE_URL: https://euknlccrsfvuaymuecpd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cp6uo1XC01OdaHeT5d8baw_9nnFkqhV
          # Public, referrer-restricted browser key; never use a server/API secret here.
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
      - name: Register the custom domain in Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CNAME="$(tr -d '[:space:]' < public/CNAME)"
          test "$CNAME" = 'trampo.lat'
          # Actions-published Pages sites ignore an uploaded CNAME file. Register
          # the same domain through the Pages settings API using pages: write.
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""' 2>/dev/null || true)"
          if [ "$CURRENT" != "$CNAME" ]; then
            if ! REGISTERED="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f cname="$CNAME" -f build_type=workflow --jq .cname)"; then
              echo "::error::Could not register $CNAME in Pages settings. A repository admin must open Settings > Pages, set Custom domain to $CNAME, save, then re-run this workflow."
              exit 1
            fi
            test "$REGISTERED" = "$CNAME"
          fi
      - name: Verify the custom-domain artifact
        run: node scripts/check-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
