name: Deploy Trampo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build live Supabase app for Pages
        run: npm run build:pages:live
        env:
          # Browser-safe public values only (the publishable key is protected by RLS).
          VITE_TRAMPO_BACKEND: supabase
          VITE_SUPABASE_URL: https://euknlccrsfvuaymuecpd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Cp6uo1XC01OdaHeT5d8baw_9nnFkqhV
          # Public, referrer-restricted browser key; never use a server/API secret here.
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
